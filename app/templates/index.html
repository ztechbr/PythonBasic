<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GW-BASIC Python Academic Port</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="layout">
  <section class="terminal-card">
    <header>
      <div>
        <h1>GW-BASIC Python Port</h1>
        <p>Portabilidade acadêmica ASM 8086 -> Python 3 / Flask MVC</p>
      </div>
      <button id="reset">NEW</button>
    </header>
    <pre id="screen">Ok</pre>
    <form id="form" autocomplete="off">
      <span class="prompt">&gt;</span>
      <input id="command" autofocus spellcheck="false" aria-label="Comando BASIC">
    </form>
  </section>
  <aside>
    <h2>Estado</h2>
    <pre id="vars">{}</pre>
    <h2>Cassete CAS1:</h2>
    <div class="cassette-panel">
      <input id="cassette-file" type="file" accept="audio/wav,audio/x-wav,audio/mpeg,.wav,.mp3">
      <div class="cassette-actions">
        <button id="mount-cassette" type="button">Montar WAV/MP3</button>
        <a id="download-cassette" href="/api/cassette/download">Baixar fita</a>
      </div>
      <pre id="cassette-status">Nenhuma fita analisada.</pre>
    </div>
    <h2>Gráficos</h2>
    <svg id="graphics" viewBox="0 0 640 400" role="img" aria-label="Saída gráfica BASIC"></svg>
  </aside>
</main>
<script>
const screen=document.getElementById('screen');
const vars=document.getElementById('vars');
const input=document.getElementById('command');
const svg=document.getElementById('graphics');
const cassetteFile=document.getElementById('cassette-file');
const cassetteStatus=document.getElementById('cassette-status');
let transcript='Ok\n';

function renderGraphics(commands){
  svg.innerHTML='';
  for(const c of commands||[]){
    let el=null;
    if(c.op==='PSET' || c.op==='PRESET'){
      el=document.createElementNS('http://www.w3.org/2000/svg','circle');
      el.setAttribute('cx',c.x); el.setAttribute('cy',c.y); el.setAttribute('r',2);
    } else if(c.op==='LINE' && c.points && c.points.length>1){
      el=document.createElementNS('http://www.w3.org/2000/svg','line');
      el.setAttribute('x1',c.points[0][0]); el.setAttribute('y1',c.points[0][1]);
      el.setAttribute('x2',c.points[1][0]); el.setAttribute('y2',c.points[1][1]);
    } else if(c.op==='CIRCLE'){
      el=document.createElementNS('http://www.w3.org/2000/svg','circle');
      el.setAttribute('cx',c.x); el.setAttribute('cy',c.y); el.setAttribute('r',c.radius);
      el.setAttribute('fill','none');
    }
    if(el){ el.setAttribute('stroke','currentColor'); el.setAttribute('fill',el.getAttribute('fill')||'currentColor'); svg.appendChild(el); }
  }
}

document.getElementById('form').addEventListener('submit',async e=>{
  e.preventDefault(); const command=input.value; input.value='';
  transcript += '> '+command+'\n';
  const r=await fetch('/api/execute',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command})});
  const d=await r.json();
  if(d.output) transcript += d.output;
  if(d.status==='waiting_input' && d.prompt) transcript += d.prompt;
  screen.textContent=transcript; screen.scrollTop=screen.scrollHeight;
  vars.textContent=JSON.stringify(d.variables||{},null,2); renderGraphics(d.graphics);
});



function renderCassetteStatus(d){
  const lines=[];
  if(d.mounted) lines.push('CAS1: '+d.mounted);
  if(d.error) lines.push('Erro: '+d.error);
  for(const f of d.files||[]){
    const addr=f.type==='M' ? ` seg=${f.segment.toString(16).toUpperCase()} off=${f.offset.toString(16).toUpperCase()}` : '';
    lines.push(`${f.name}.${f.type} ${f.bytes} bytes CRC=${f.crc_ok?'OK':'ERRO'}${addr}`);
  }
  cassetteStatus.textContent=lines.join('\n') || 'Fita montada, sem arquivos BASIC indexados.';
}

document.getElementById('mount-cassette').addEventListener('click',async()=>{
  if(!cassetteFile.files.length){ cassetteStatus.textContent='Selecione um WAV ou MP3.'; return; }
  const body=new FormData(); body.append('cassette',cassetteFile.files[0]);
  cassetteStatus.textContent='Analisando sinal CAS1:...';
  const r=await fetch('/api/cassette/upload',{method:'POST',body});
  const d=await r.json(); renderCassetteStatus(d);
});

fetch('/api/cassette/status').then(r=>r.json()).then(renderCassetteStatus).catch(()=>{});

document.getElementById('reset').addEventListener('click',async()=>{
  await fetch('/api/reset',{method:'POST'}); transcript='Ok\n'; screen.textContent=transcript; vars.textContent='{}'; svg.innerHTML=''; input.focus();
});
</script>
</body>
</html>
